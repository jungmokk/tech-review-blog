name: Automated Tech Review Generation & Deploy

on:
  schedule:
    - cron: '0 0 * * *' # 매일 한국 시간 오전 9시 (UTC 00:00)
  workflow_dispatch: # 수동 실행 버튼 지원
    inputs:
      device:
        description: '리뷰를 생성할 특정 기기명 (예: 갤럭시 Z 폴드8, M4 Mac Mini / 비워둘 경우 RSS 자동 감지)'
        required: false
        default: '갤럭시 Z 폴드8'
        type: string
      force:
        description: '이미 발행된 기기라도 강제 재생성 여부'
        required: false
        default: true
        type: boolean

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run Auto Review Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_MODEL: ${{ secrets.QWEN_MODEL }}
          YOUTUBE_API: ${{ secrets.YOUTUBE_API }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API }}
          TARGET_DEVICE: ${{ inputs.device }}
          FORCE_GENERATE: ${{ inputs.force }}
        run: |
          CMD="python scripts/generate.py"
          if [ -n "$TARGET_DEVICE" ]; then
            CMD="$CMD --device \"$TARGET_DEVICE\""
          fi
          if [ "$FORCE_GENERATE" = "true" ]; then
            CMD="$CMD --force"
          fi
          echo "Executing: $CMD"
          eval $CMD

      - name: Commit and Push New Review
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: add new tech review post"
          branch: main
